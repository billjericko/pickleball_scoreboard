<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickleball Scoreboard Control</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0a0612;color:#f1e9ff;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  .wrap{max-width:560px;margin:0 auto;padding:14px}
  h1{font-size:16px;margin:0 0 12px;letter-spacing:.06em;text-transform:uppercase;color:#ff7a00}
  section{background:#1a0b33;border:1px solid #2e1566;border-radius:12px;padding:12px;margin-bottom:12px}
  .team{border-left:6px solid var(--c,#ff7a00)}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#b9a4e6;margin:8px 0 3px}
  input[type=text]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #4a2a8a;background:#0a0612;color:#fff;font-size:15px}
  select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #4a2a8a;background:#0a0612;color:#fff;font-size:15px}
  input[type=color]{width:44px;height:34px;border:0;background:none;padding:0}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .score{display:flex;align-items:center;gap:10px;margin-top:10px}
  .big{font-size:44px;font-weight:900;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
  button{border:0;border-radius:8px;padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer;background:#3b1f6b;color:#fff}
  button:hover{filter:brightness(1.2)}
  button.pri{background:#ff7a00;color:#000}
  button.warn{background:#6d28d9}
  button.srv.on{background:#ff7a00;color:#000}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .small{padding:6px 10px;font-size:13px}
  .chk{display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-size:13px;text-transform:none;letter-spacing:0;color:#e2e8f0}
  .call{font-size:20px;font-weight:800;color:#ff7a00;font-variant-numeric:tabular-nums}
  .hint{font-size:12px;color:#b9a4e6;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pickleball Scoreboard Control</h1>

  <section>
    <label>Scoreboard title</label>
    <input type="text" id="title">
    <div style="margin-top:10px">
      <label class="chk"><input type="checkbox" id="showServe"> Server ball</label>
      <label class="chk"><input type="checkbox" id="showGames"> Games won</label>
      <label class="chk"><input type="checkbox" id="showCall"> Score call</label>
      <label class="chk"><input type="checkbox" id="showBg"> Full-screen background</label>
    </div>
    <label>Layout</label>
    <select id="layout"><option value="full">Full screen (centered, large)</option><option value="corner">Corner overlay (bottom-left)</option></select>
    <div class="hint">For OBS over video: untick Full-screen background so the overlay is transparent.</div>
  </section>

  <div id="teams"></div>

  <section>
    <div class="row" style="justify-content:space-between">
      <div>Score call: <span class="call" id="call"></span></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="warn" id="fault">Fault / next server</button>
      <button id="swap">Swap teams</button>
      <button id="reset">Reset points</button>
      <button id="resetAll">Reset everything</button>
    </div>
    <div class="hint">Shortcuts: Q / W = +1 Team A / Team B, A / S = −1, F = fault. (Not active while typing in a field.)</div>
  </section>
</div>

<script>
const K='pb_state_v2';
const def={title:'Pickleball',showServe:true,showGames:true,showCall:true,showBg:true,layout:'full',serving:0,server:2,
  t:[{name:'Team A',p:['Player 1','Player 2'],score:0,games:0,color:'#ff7a00'},
     {name:'Team B',p:['Player 3','Player 4'],score:0,games:0,color:'#8b5cf6'}]};
let bc=null;try{bc=new BroadcastChannel('pb_channel')}catch(e){}
function load(){try{return Object.assign({},def,JSON.parse(localStorage.getItem(K)))}catch(e){return JSON.parse(JSON.stringify(def))}}
let S=load();
function save(){localStorage.setItem(K,JSON.stringify(S));if(bc)bc.postMessage(1);sync()}

const teams=document.getElementById('teams');
for(let i=0;i<2;i++){
  const d=document.createElement('section');d.className='team';d.id='team'+i;
  d.innerHTML=`
    <div class="g2">
      <div><label>Team name</label><input type="text" data-k="name" data-i="${i}"></div>
      <div><label>Color</label><input type="color" data-k="color" data-i="${i}"></div>
    </div>
    <div class="g2">
      <div><label>Player 1</label><input type="text" data-k="p0" data-i="${i}"></div>
      <div><label>Player 2</label><input type="text" data-k="p1" data-i="${i}"></div>
    </div>
    <div class="score">
      <button data-a="minus" data-i="${i}">−</button>
      <div class="big" id="sc${i}">0</div>
      <button class="pri" data-a="plus" data-i="${i}">+1</button>
      <button class="srv" data-a="serve" data-i="${i}" id="sv${i}">Serving</button>
    </div>
    <div class="row" style="margin-top:10px">
      <span>Games won:</span>
      <button class="small" data-a="gminus" data-i="${i}">−</button>
      <b id="gm${i}">0</b>
      <button class="small" data-a="gplus" data-i="${i}">+</button>
    </div>`;
  teams.appendChild(d);
}

function point(i,d){S.t[i].score=Math.max(0,S.t[i].score+d);save()}
function fault(){if(S.server===1){S.server=2}else{S.serving=1-S.serving;S.server=1}save()}

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='title'){S.title=el.value;save();return}
  if(el.id==='layout'){S.layout=el.value;save();return}
  if(el.type==='checkbox'){S[el.id]=el.checked;save();return}
  const k=el.dataset.k,i=el.dataset.i;
  if(k===undefined)return;
  if(k==='p0'||k==='p1')S.t[i].p[+k[1]]=el.value;else S.t[i][k]=el.value;
  save();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const i=+b.dataset.i,a=b.dataset.a;
  if(a==='plus')point(i,1);
  else if(a==='minus')point(i,-1);
  else if(a==='gplus'){S.t[i].games++;save()}
  else if(a==='gminus'){S.t[i].games=Math.max(0,S.t[i].games-1);save()}
  else if(a==='serve'){if(S.serving===i){S.server=S.server===1?2:1}else{S.serving=i;S.server=1}save()}
  else if(b.id==='fault')fault();
  else if(b.id==='swap'){S.t.reverse();S.serving=1-S.serving;save()}
  else if(b.id==='reset'){S.t.forEach(t=>t.score=0);S.server=2;save()}
  else if(b.id==='resetAll'){if(confirm('Reset names, scores and games?')){S=JSON.parse(JSON.stringify(def));save()}}
});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=='checkbox')return;
  const k=e.key.toLowerCase();
  if(k==='q')point(0,1);else if(k==='w')point(1,1);
  else if(k==='a')point(0,-1);else if(k==='s')point(1,-1);
  else if(k==='f')fault();
});

function sync(){
  document.getElementById('title').value!==S.title&&document.activeElement.id!=='title'&&(document.getElementById('title').value=S.title);
  document.getElementById('layout').value=S.layout;
  ['showServe','showGames','showCall','showBg'].forEach(k=>document.getElementById(k).checked=!!S[k]);
  S.t.forEach((t,i)=>{
    document.getElementById('team'+i).style.setProperty('--c',t.color);
    document.querySelectorAll(`#team${i} input[data-k]`).forEach(el=>{
      if(el===document.activeElement)return;
      const k=el.dataset.k;
      el.value=(k==='p0')?t.p[0]:(k==='p1')?t.p[1]:t[k];
    });
    document.getElementById('sc'+i).textContent=t.score;
    document.getElementById('gm'+i).textContent=t.games;
    const sv=document.getElementById('sv'+i);
    sv.classList.toggle('on',S.serving===i);
    sv.textContent=S.serving===i?'Server '+S.server:'Serve';
  });
  const a=S.serving,b=1-a;
  document.getElementById('call').textContent=S.t[a].score+' - '+S.t[b].score+' - '+S.server;
}
window.addEventListener('storage',()=>{S=load();sync()});
sync();save();
</script>
</body>
</html>
